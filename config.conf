# Gaomon Tablet Driver & PenCursor KernelSU Configuration
# Managed by KernelSU WebUI & pencursor inotify hot-reload

# Daemon & Overlay switches
daemon_enabled=true
overlay_enabled=true

# Cursor style: both | crosshair | circle
style=both

# Cursor geometry (pixels within 64x64 hardware sprite)
crosshair_size=10.00
crosshair_gap=3.50
crosshair_thickness=1.50
circle_radius=12.00
circle_thickness=1.50
contact_dot_radius=2.00

# Cursor color palette (#RRGGBBAA)
primary_color=#FFFFFFFF
outline_color=#0D0D0DF2
contact_color=#00E6FFFF

# Timeout & polling thresholds (milliseconds)
hover_timeout_ms=150
mouse_inactivity_timeout_ms=100
active_poll_interval_ms=1
idle_poll_interval_ms=10

# USB & OTG runtime power management
usb_vid=256c
usb_pid=0064
disable_usbcore_autosuspend=true
enforce_oplus_otg_switch=true
force_device_power_on=true
